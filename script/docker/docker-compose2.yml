version: '3'

services:
  ruoyi-server1:
    # 使用 build 指令来构建镜像
    build:
      context: .
      dockerfile: Dockerfile
    image: ruoyi/ruoyi-server:5.2.3
    container_name: ruoyi-server1
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
    volumes:
      # 配置文件
      - /docker/server1/logs/:/ruoyi/server/logs/
      # skywalking 探针
#      - /docker/skywalking/agent/:/ruoyi/skywalking/agent
      # 挂载 jar 包
      - ./target/ruoyi-admin.jar:/ruoyi/server/app.jar
    privileged: true
    network_mode: "host"

